name: release

on:
  push:
    branches: [dev, main]

permissions:
  contents: write

# release-запуски выстраиваются в очередь: параллельные мержи
# получают теги последовательно и не конфликтуют
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: test
        run: go test ./...
      - name: compute version
        id: ver
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          [ -z "$LATEST" ] && LATEST=v0.0
          # старые теги трёхчастные (v1.5.0), новые — двузначные (v1.6):
          # вырезаем patch, если он есть
          VER=${LATEST#v}
          MA=${VER%%.*}
          MI=${VER#*.}; MI=${MI%%.*}
          if [ "$BRANCH" = "main" ]; then
            MA=$((MA+1)); MI=0
          else
            MI=$((MI+1))
          fi
          echo "tag=v$MA.$MI" >> "$GITHUB_OUTPUT"
      - name: build binaries
        run: |
          V=${{ steps.ver.outputs.tag }}
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 EXT=$3
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags "-s -w -X main.version=$V" \
              -o dist/hello-guest-$GOOS-$GOARCH$EXT ./cmd/hello-guest
          }
          build darwin arm64 ""
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          ls -la dist
      - name: build manual pdf
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc python3-pip \
            libpango-1.0-0 libpangocairo-1.0-0 fonts-dejavu-core
          python3 -m pip install --break-system-packages --quiet weasyprint
          mkdir -p dist-pdf
          pandoc docs/README.md docs/startup.md docs/home.md docs/status.md docs/admin.md \
            -H docs/pdf-header.html --toc --toc-depth=2 \
            --metadata title="Hello Guest" \
            --metadata subtitle="Руководство пользователя" \
            --metadata author="github.com/shnikita-cr/hello-guest" \
            --metadata date="Версия $TAG · $(date -u +%d.%m.%Y)" \
            -o dist-pdf/hello-guest-manual.html
          weasyprint dist-pdf/hello-guest-manual.html dist-pdf/hello-guest-manual.pdf
          ls -la dist-pdf
      - name: tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | head -1)
          NOTES="hello-guest $TAG"
          if [ -n "$PREV" ]; then
            NOTES="$NOTES

          $(git log --pretty=format:'- %s' $PREV..HEAD | grep -v '^- release' || true)"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/* dist-pdf/hello-guest-manual.pdf --title "$TAG" --notes "$NOTES"

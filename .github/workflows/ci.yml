name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: test with coverage
        run: go test -count=1 -coverprofile=cover.out ./...
      - name: coverage report and 80% gate
        run: |
          go tool cover -func=cover.out | tail -1
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "coverage=${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 80) { print "coverage below 80%: " t; exit 1 } }'
